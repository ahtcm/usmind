    <div id="ai-panel" class="ai-panel hidden">
      <div class="ai-header">
        <span>AI 助手</span>
        <button id="ai-close" class="ai-close">×</button>
      </div>
      <div class="ai-body">
        <div class="ai-mode">
          <button data-mode="create" class="ai-mode-btn active">创作</button>
          <button data-mode="summary" class="ai-mode-btn">总结</button>
          <button data-mode="chat" class="ai-mode-btn">交互</button>
        </div>
        <textarea id="ai-input" placeholder="输入指令，例如：为「项目规划」生成思维导图框架..."></textarea>
        <button id="ai-run" class="ai-run">生成</button>
        <div id="ai-output" class="ai-output">
          <div class="ai-output-empty">AI 输出将显示在这里</div>
        </div>
      </div>
    </div>

    <!-- 自定义右键菜单(XMind 风格) -->
    <div id="ctx-menu" class="ctx-menu hidden">
      <button data-act="insert-child"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v8M8 12h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>插入子主题</button>

      <div class="ctx-subwrap">
        <button data-act="font-family"><svg viewBox="0 0 24 24"><path d="M5 19L10 5h4l5 14M7.5 14h9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>字体<svg class="ctx-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

          <button data-sub="fontFamily" data-value="Microsoft YaHei">微软雅黑</button>
          <button data-sub="fontFamily" data-value="SimSun">宋体</button>

          <button data-sub="fontFamily" data-value="KaiTi">楷体</button>
          <button data-sub="fontFamily" data-value="DengXian">等线</button>

        <div class="ctx-sub">
          <button data-sub="fontSize" data-value="12">12</button>
          <button data-sub="fontSize" data-value="14">14</button>
          <button data-sub="fontSize" data-value="16">16</button>
          <button data-sub="fontSize" data-value="18">18</button>
          <button data-sub="fontSize" data-value="20">20</button>
          <button data-sub="fontSize" data-value="24">24</button>
          <button data-sub="fontSize" data-value="28">28</button>
          <button data-sub="fontSize" data-value="32">32</button>
          <button data-sub="fontSize" data-value="36">36</button>
        </div>
      </div>
      <div class="ctx-subwrap">
        <button data-act="insert-media"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 10.5v3l2.5-1.5zM14 10v4a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>插入<svg class="ctx-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

          <button data-act="insert-image">图片</button>
          <button data-act="insert-audio">音频</button>
          <button data-act="insert-video">视频</button>
          <button data-act="insert-file">文件</button>
          <div class="ctx-sep"></div>
          <button data-act="insert-link">链接</button>
          <button data-act="insert-note">备注</button>
        </div>
      </div>
      <button data-act="del-attachment"><svg viewBox="0 0 24 24"><path d="M5 6h14M9 6V4h6v2M7 6l1 14h8l1-14M12 10v6M9 13h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>删除附件</button>

      <div class="ctx-sep"></div>
      <button data-act="copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 15V5a2 2 0 0 1 2-2h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>复制</button>

      <button data-act="del" class="ctx-danger"><svg viewBox="0 0 24 24"><path d="M5 6h14M9 6V4h6v2M7 6l1 14h8l1-14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>删除节点</button>

  </div>
