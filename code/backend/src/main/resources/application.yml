server:
  port: 8899

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: null

jwt:
  # 生产环境务必通过环境变量 USMIND_JWT_SECRET 配置（至少 32 字节随机串）；
  # 留空或使用公开默认值时，系统会自动生成随机密钥并持久化到 data/jwt-secret.key
  secret: ""
  expire: 86400000

file:
  # 上传目录：默认 ./uploads（相对工作目录），可用环境变量 USMIND_UPLOAD_DIR 覆盖（Docker 挂载卷）
  upload-dir: ${USMIND_UPLOAD_DIR:./uploads}

ipguard:
  # 本项目统一经 nginx 反向代理（nginx 已强制覆盖 X-Real-IP / X-Forwarded-For 为真实客户端 IP）。
  # 直连后端 8899 时请求头一律不可信（IpGuardFilter 有内网代理来源校验兜底）。
  trusted-proxy: true

oss:
  # 加密 OSS SecretKey 的 AES 密钥；生产环境通过环境变量 USMIND_OSS_CIPHER_KEY 配置
  secret-cipher-key: ""

preview:
  office-server:

ai:
  api-url:
  api-key:
