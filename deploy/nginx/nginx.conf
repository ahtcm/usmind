# ============================================================
# USMIND Nginx 容器内配置
#   - 80   统一入口：/       用户端静态；/admin/ 管理后台静态
#               /api/ /ws /uploads/ 反代 backend:8899
#   - 8866 兼容直连：用户端（原端口）
#   - 8867 兼容直连：管理后台（原端口）
# 上传目录 /data/uploads 由 backend 卷共享（只读挂载）
# 注意：正则 location 只能出现在 server 级（不可嵌套），
#       静态缓存规则统一提级到 server 级（正则优先于前缀）。
# ============================================================
server_tokens off;
client_max_body_size 500m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1k;

# ---------- 统一入口 80 ----------
server {
    listen 80;
    server_name _;

    location = /admin { return 301 /admin/; }
    location = /admin/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~* \.(js|css|png|jpe?g|gif|svg|webp|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location /admin/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location /api/ {
        proxy_pass http://backend:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location /ws {
        proxy_pass http://backend:8899;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }
    location /uploads/ {
        alias /data/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location / {
        root /usr/share/nginx/html/user;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 兼容直连 8866（用户端） ----------
server {
    listen 8866;
    server_name _;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
