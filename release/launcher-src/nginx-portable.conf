worker_processes  1;
events { worker_connections  1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # ============ 统一入口 80（外部穿透） ============
    #    /           -> 用户端 web-user（html/usmind）
    #    /admin/     -> 管理后台 web-admin（html/admin）
    #    /api/       -> 后端 API 8899
    #    /uploads/   -> 上传资源 8899
    server {
        listen       80;
        server_name  localhost;
        location /api/     { proxy_pass http://127.0.0.1:8899; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /uploads/ { proxy_pass http://127.0.0.1:8899; proxy_set_header Host $host; }
        location /admin/ {
            alias html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }
        location / {
            root   html/usmind;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ============ 兼容：用户端 8866 ============
    server {
        listen       8866;
        server_name  localhost;
        location /api/     { proxy_pass http://127.0.0.1:8899; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /uploads/ { proxy_pass http://127.0.0.1:8899; proxy_set_header Host $host; }
        location / {
            root   html/usmind;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ============ 兼容：管理后台 8867 -> /admin/ ============
    server {
        listen       8867;
        server_name  localhost;
        location /api/     { proxy_pass http://127.0.0.1:8899; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /uploads/ { proxy_pass http://127.0.0.1:8899; proxy_set_header Host $host; }
        location /admin/ {
            alias html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }
        location = / { return 301 http://127.0.0.1:8867/admin/; }
        location / { return 301 http://127.0.0.1:8867/admin/; }
    }
}
